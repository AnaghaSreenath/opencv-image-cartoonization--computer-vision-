<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCV Cartoonization</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <h1>OpenCV Cartoonization</h1>
        <p>Upload your image, run outline extraction, and tune cartoon-relevant controls.</p>
      </header>

      <main>
        <form id="process-form" class="studio-form">
          <section class="card showcase">
            <div class="showcase-header">
              <label class="upload-drop" for="image">
                <span class="upload-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" role="img">
                    <path
                      d="M12 3.5 7.8 7.7l1.4 1.4 1.8-1.8V15h2V7.3l1.8 1.8 1.4-1.4L12 3.5Zm-7 12.2v2.8A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-2.8h-2v2.3H7v-2.3H5Z"
                    />
                  </svg>
                </span>
                <span class="upload-text">
                  <strong id="upload-title">Upload image</strong>
                  <small id="upload-subtitle">PNG or JPG · max 12MB</small>
                </span>
              </label>
              <input id="image" name="image" type="file" accept="image/*" required />
              <button id="generate-btn" type="submit">Generate</button>
            </div>
            <p id="status" role="status" aria-live="polite"></p>

            <div class="image-focus-grid">
              <article class="focus-card">
                <h2>Original</h2>
                <img id="original-preview" alt="Original preview" />
              </article>

              <article class="focus-card">
                <h2>Outline Extraction</h2>
                <img id="outline-result" alt="Outline result" />
                <a id="outline-download" class="download" download="outline.png">Download outline</a>
              </article>

              <article class="focus-card">
                <h2>Cartoonized</h2>
                <img id="cartoon-result" alt="Cartoonized result" />
                <a id="cartoon-download" class="download" download="cartoon.png">Download cartoon</a>
              </article>
            </div>
          </section>

          <section class="card controls">
            <h2>Processing dials</h2>
            <div id="dial-list">
              {% for control in controls %}
              <div class="dial-group" data-control="{{ control.name }}">
                <div class="dial-header">
                  <label for="{{ control.name }}">{{ control.label }}</label>
                  <input
                    class="dial-value"
                    id="{{ control.name }}-value"
                    type="number"
                    min="{{ control.min }}"
                    max="{{ control.max }}"
                    step="{{ control.step }}"
                    value="{{ control.default }}"
                  />
                </div>
                <input
                  class="dial-slider"
                  id="{{ control.name }}"
                  name="{{ control.name }}"
                  type="range"
                  min="{{ control.min }}"
                  max="{{ control.max }}"
                  step="{{ control.step }}"
                  value="{{ control.default }}"
                  data-odd="{{ 1 if control.odd else 0 }}"
                />
              </div>
              {% endfor %}
            </div>

            <label class="toggle">
              <input id="invert_outline" name="invert_outline" type="checkbox" />
              Invert outline colors (white lines on black)
            </label>
          </section>
        </form>
      </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
  </html>
